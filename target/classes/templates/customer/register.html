
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4 mx-auto"
         style="max-width: 550px;">

        <h2 class="text-center mb-4">
            Create Bank Account
        </h2>

        <form th:action="@{/register}"
              th:object="${registrationRequest}"
              method="post">

            <h5>Login Information</h5>

            <div class="mb-3">
                <label>Email</label>
                <input type="email"
                       th:field="*{email}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password"
                       th:field="*{password}"
                       class="form-control"
                       required>
            </div>

            <hr>

            <h5>Personal Information</h5>

            <div class="mb-3">
                <label>Full Name</label>
                <input type="text"
                       th:field="*{fullName}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Phone Number</label>
                <input type="text"
                       th:field="*{phone}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Address</label>
                <textarea th:field="*{address}"
                          class="form-control"
                          required></textarea>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100">
                Register
            </button>

        </form>

    </div>

</div>

</body>
</html>
